services:
  api:
    # Built by .github/workflows/docker-publish.yml — never on the server.
    # pull_policy always: the tag moves with each push, so `up -d` fetches it.
    image: ghcr.io/aak-mbu/befordringssystemet-api:${BEFORDRING_IMAGE_TAG:-develop}
    pull_policy: always
    container_name: befordringssystemet-api
    environment:
      API_KEY: ${API_KEY}
      API_KEY_HASHES: ${API_KEY_HASHES}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      # Must be Azure B2C's /tfp/ path form, not ?p=<policy> — see
      # backend/app/core/oidc.py for why the query form breaks login.
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL}
      # Where the IdP returns the browser after logout. Required — B2C rejects a
      # logout request that omits it (AADB2C90036), so an unset value turns every
      # logout into an error page. Point it at this deployment's /logged-out.
      OIDC_POST_LOGOUT_REDIRECT: ${OIDC_POST_LOGOUT_REDIRECT}
      # IdP role claim values allowed to write; everyone else is read-only.
      EDIT_ROLES: ${EDIT_ROLES:-admin,user-edit}
      OIDC_SCOPES: ${OIDC_SCOPES}
      OIDC_ENVIRONMENT: ${OIDC_ENVIRONMENT}
      SESSION_SECRET: ${SESSION_SECRET}
      GRAPH_CERT_PUBLIC: /run/secrets/graph_client.cer
      GRAPH_CERT_PEM: /run/secrets/graph_client.pem
    healthcheck:
      # /health/ready, not /health: /health returns a literal {"status":"ok"}
      # and touches nothing, so it cannot fail while the API is unable to serve
      # a single request. /health/ready takes a pooled connection and runs
      # SELECT 1, so pool exhaustion and an unreachable database both show up.
      # 127.0.0.1 rather than localhost, which resolves to [::1] first while the
      # server binds IPv4 — curl retries the next address, wget does not.
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - /etc/ssl/private/sharepoint-graph-client.cer:/run/secrets/graph_client.cer:ro
      - /etc/ssl/private/sharepoint-graph-client-combined.pem:/run/secrets/graph_client.pem:ro
    networks:
      edge:
        aliases:
          - befordringssystemet-api

  frontend:
    # Built by .github/workflows/docker-publish.yml — never on the server.
    # pull_policy always: the tag moves with each push, so `up -d` fetches it.
    image: ghcr.io/aak-mbu/befordringssystemet-frontend:${BEFORDRING_IMAGE_TAG:-develop}
    pull_policy: always
    container_name: befordringssystemet-frontend
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      # Browser-facing URL that starts the OIDC login flow. Defaults to the
      # same-origin /api/auth/login, which assumes the edge proxy forwards /api
      # to the backend. Set an absolute URL where it does not.
      PUBLIC_OIDC_LOGIN_URL: ${PUBLIC_OIDC_LOGIN_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Two corrections, both needed. localhost resolves to [::1] first and the
      # server binds 0.0.0.0 (IPv4 only), so wget was refused at the TCP layer
      # and never reached HTTP. And "/" is behind the auth guard, which answers
      # 401 to an anonymous non-document request by design — wget --spider exits
      # non-zero on a 4xx. /health is an unguarded liveness route added for this;
      # see frontend/src/routes/health/+server.ts.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - befordringssystemet-frontend

networks:
  edge:
    external: true
# Builds the API and frontend images and publishes them to GitHub Container
# Registry, so the servers pull finished images instead of building them.
#
#   push to develop  -> :develop   (docker-compose_dev.yml)
#   push to main     -> :main      (docker-compose_prod.yml)
#   every push also  -> :sha-<short commit>, to pin or roll back to
#   pull request     -> build only, nothing pushed
#
# Images: ghcr.io/aak-mbu/befordringssystemet-api
#         ghcr.io/aak-mbu/befordringssystemet-frontend
# Nothing environment-specific is baked in — both read their settings from
# .env when the container starts — so one image serves dev and prod. The Graph
# certificate stays a host volume mount; it is never in an image.

name: Docker images

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
          - name: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR names must be lowercase; the org is AAK-MBU. The image name
          # deliberately differs from the repo name (api-befordrings-applikation)
          # — the org.opencontainers.image.source label still links the package
          # back to the repo.
          images: ghcr.io/aak-mbu/befordringssystemet-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

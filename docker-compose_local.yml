services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: befordringssystemet-api
    environment:
      API_KEY: ${API_KEY}
      API_KEY_HASHES: ${API_KEY_HASHES}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # Where the IdP sends the browser back after login. .env holds the
      # deployed value; using it here would hand the IdP a redirect_uri on the
      # real host, so a local login would leave localhost and 404 on the edge
      # proxy. Point it at the frontend this file publishes on :80 instead —
      # /callback is the SvelteKit route that finishes the flow.
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI_LOCAL:-http://localhost/callback}
      # Must be the /tfp/ path form, not ?p=<policy> — see backend/app/core/oidc.py.
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL}
      OIDC_SCOPES: ${OIDC_SCOPES}
      # IdP role claim values allowed to write; everyone else is read-only.
      EDIT_ROLES: ${EDIT_ROLES:-admin,user-edit}
      # Landing page after logout, served by the frontend on :80. Required —
      # B2C errors out on a logout request that omits it.
      OIDC_POST_LOGOUT_REDIRECT: ${OIDC_POST_LOGOUT_REDIRECT_LOCAL:-http://localhost/logged-out}
      OIDC_ENVIRONMENT: ${OIDC_ENVIRONMENT}
      SESSION_SECRET: ${SESSION_SECRET}
      # Point requests at the CA bundle *inside* the container (Linux path),
      # overriding the Windows path in .env. The file is mounted below.
      REQUESTS_CA_BUNDLE: /app/certs/aarhus_root.pem
      APPREG_THUMBPRINT: ${APPREG_THUMBPRINT}
      CLIENT_ID: ${CLIENT_ID}
      TENANT: ${TENANT}
      GRAPH_CERT_PEM: /app/certs/sharepoint-graph-client-fixed.pem
    healthcheck:
      # /health/ready, not /health: /health returns a literal {"status":"ok"}
      # and touches nothing, so it cannot fail while the API is unable to serve
      # a single request. /health/ready takes a pooled connection and runs
      # SELECT 1, so pool exhaustion and an unreachable database both show up.
      # 127.0.0.1 rather than localhost, which resolves to [::1] first while the
      # server binds IPv4 — curl retries the next address, wget does not.
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount the host cert dir into the container so REQUESTS_CA_BUNDLE resolves.
      - C:/tmp/certs:/app/certs:ro
    restart: unless-stopped
    networks:
      - befordringssystemet-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: befordringssystemet-frontend
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      # Browser-facing URL that starts the OIDC login flow. Defaults to the
      # same-origin /api/auth/login, which assumes the edge proxy forwards /api
      # to the backend. Set an absolute URL where it does not.
      PUBLIC_OIDC_LOGIN_URL: ${PUBLIC_OIDC_LOGIN_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Two corrections, both needed. localhost resolves to [::1] first and the
      # server binds 0.0.0.0 (IPv4 only), so wget was refused at the TCP layer
      # and never reached HTTP. And "/" is behind the auth guard, which answers
      # 401 to an anonymous non-document request by design — wget --spider exits
      # non-zero on a 4xx. /health is an unguarded liveness route added for this;
      # see frontend/src/routes/health/+server.ts.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "80:80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - befordringssystemet-network

networks:
  befordringssystemet-network: {}